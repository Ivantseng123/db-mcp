[project]
name = "db-mcp"
version = "0.1.0"
description = "Standalone read-only SQL MCP server: one tool pair per configured connection (Oracle / SQL Server)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "oracledb>=2.0",
    "python-tds>=1.15",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
db-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
